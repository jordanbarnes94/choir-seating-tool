[package]
name = "choir-seating-tool"
version = "0.0.0"
description = "Choir Seating Tool in a window of its own"
authors = ["Jordan Barnes"]
license = "AGPL-3.0-only"
repository = "https://github.com/jordanbarnes94/choir-seating-tool"
edition = "2024"
publish = false

[lib]
name = "choir_seating_tool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
tauri = { version = "2.12.1", features = [] }
# The plugin settings in tauri.conf.json are read as JSON by the code Tauri generates.
serde_json = "1"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"

# The download is one file, so it is built for size.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
