name: Release

# A version tag builds the app once and publishes it as a GitHub Release: the web build as a zip,
# and the desktop app for Windows. The website serves the web app by unpacking that zip when it
# is next published, so the hosted copy cannot differ from the zip.
#
# Every file has the same name in every release, so that
# https://github.com/<owner>/<repo>/releases/latest/download/<name> is always the newest one.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: The tag is the version in package.json
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME but package.json says $version"
            exit 1
          fi
      - run: npm ci
      - run: npm test
      - run: node tools/store-smoke.mjs
      - run: npm run build
      - name: Write version.json
        run: |
          node -e '
            const { version } = require("./package.json");
            const built = new Date().toISOString().replace(/\.\d+Z$/, "Z");
            require("fs").writeFileSync("dist/version.json", JSON.stringify({ version, commit: process.env.GITHUB_SHA, built }, null, 2) + "\n");
          '
          cat dist/version.json
      - name: Zip the build
        run: |
          mkdir release
          cp -r dist release/choir-seating-tool
          cd release
          zip -r -q choir-seating-tool.zip choir-seating-tool
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip=release/choir-seating-tool.zip
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$zip" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$zip" --title "Choir Seating Tool $GITHUB_REF_NAME" --generate-notes
          fi

  # The desktop app for Windows, from the same commit: the one file, the installer, and the file an
  # installed copy reads to learn there is a newer one. They join the Release the build job made.
  # Until latest.json is there, a copy that asks finds nothing and carries on.
  desktop:
    needs: build
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The build lists the crates in the program in THIRD-PARTY-NOTICES.txt with this.
      - run: cargo install --locked cargo-about@0.9.2 --features cli
      - name: Build the app and its installer
        env:
          # The installer is signed with this, and an installed copy takes an update only if the
          # signature matches the public key in src-tauri/tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: npx tauri build
      - name: Name the files and write latest.json
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir desktop
          cp "src-tauri/target/release/Choir Seating Tool.exe" desktop/Choir-Seating-Tool.exe
          cp "src-tauri/target/release/bundle/nsis/Choir Seating Tool_${version}_x64-setup.exe" desktop/Choir-Seating-Tool-setup.exe
          SIG="src-tauri/target/release/bundle/nsis/Choir Seating Tool_${version}_x64-setup.exe.sig" VERSION="$version" node -e '
            const fs = require("fs");
            const { SIG, VERSION, GITHUB_REPOSITORY, GITHUB_REF_NAME } = process.env;
            // The installer on this release, not latest/: the signature beside it is for this file.
            const url = `https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/Choir-Seating-Tool-setup.exe`;
            const pub_date = new Date().toISOString().replace(/\.\d+Z$/, "Z");
            const platforms = { "windows-x86_64": { signature: fs.readFileSync(SIG, "utf8").trim(), url } };
            fs.writeFileSync("desktop/latest.json", JSON.stringify({ version: VERSION, pub_date, platforms }, null, 2) + "\n");
          '
          cat desktop/latest.json
      - name: Add them to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" desktop/* --clobber
